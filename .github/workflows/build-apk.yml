name: Compilar y Publicar APK (Tasa Bisu)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar APK y crear Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restaurar caché de debug.keystore (respaldo si no hay secreto ni base64)
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: tasa-bisu-debug-keystore-v1

      - name: Preparar firma debug.keystore y archivo .env
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "Usando debug.keystore desde GitHub Secrets"
            printf '%s' "$SECRET_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore.base64 del repositorio (firma consistente)"
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generando debug.keystore local para esta compilación"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Tasa Bisu,OU=Bisuteria888,O=TasaBisu,L=Caracas,S=DC,C=VE"
          else
            echo "Reutilizando debug.keystore desde caché de GitHub Actions"
          fi

      - name: Aceptar licencias de Android SDK
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Compilar APK Debug firmada
        env:
          APP_VERSION_NAME: 1.2.${{ github.run_number }}
        run: |
          export APP_VERSION_CODE=$((200 + ${GITHUB_RUN_NUMBER:-1}))
          echo "Compilando Tasa Bisu v$APP_VERSION_NAME (versionCode=$APP_VERSION_CODE)"
          gradle :app:assembleDebug --no-daemon

      - name: Preparar archivo APK con número de versión
        run: |
          mkdir -p release-output
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "No se encontró el APK compilado en $APK_SOURCE"
            exit 1
          fi
          cp "$APK_SOURCE" "release-output/tasa-bisu-v1.2.${{ github.run_number }}.apk"

      - name: Guardar APK como artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: tasa-bisu-v1.2.${{ github.run_number }}
          path: release-output/tasa-bisu-v1.2.${{ github.run_number }}.apk
          retention-days: 30

      - name: Publicar GitHub Release con APK listo para actualizar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Tasa Bisu v1.2.${{ github.run_number }}
          make_latest: true
          body: |
            Nueva compilación automática de **Tasa Bisu** (`v1.2.${{ github.run_number }}`).

            **Cambios incluidos:**
            ${{ github.event.head_commit.message || 'Actualización manual desde GitHub Actions' }}

            **Cómo actualizar en el teléfono:**
            1. Descarga `tasa-bisu-v1.2.${{ github.run_number }}.apk` abajo en **Assets**.
            2. Ábrelo desde **Archivos / Descargas** y toca **Actualizar** (no necesitas desinstalar la versión anterior).
          files: |
            release-output/tasa-bisu-v1.2.${{ github.run_number }}.apk
